name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer

      - name: Build
        run: swift build

      - name: Test
        run: swift test

  build-ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer

      - name: Build for iOS
        run: >
          xcodebuild build
          -scheme MarkdownMathUI
          -destination "platform=iOS Simulator,name=iPhone 16,OS=18.0"
          -skipPackagePluginValidation

      - name: Test for iOS
        run: >
          xcodebuild test
          -scheme MarkdownMathUI
          -destination "platform=iOS Simulator,name=iPhone 16,OS=18.0"
          -skipPackagePluginValidation
